openapi: 3.0.0
info:
  title: Flights API
  description: KongAir Flights service provides the scheduled flights for KongAir.
  version: 0.1.0
security:
  - BearerAuth: []
paths:
  /flights:
    get:
      summary: Get KongAir planned flights
      description: Returns all the scheduled flights for a given day.
      tags:
        - flight-data
      operationId: get-flights
      parameters:
        - name: date
          in: query
          description: Filter by date (defaults to current day)
          required: false
          style: form
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response with scheduled flights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flight'
              examples:
                Example Flights List:
                  value: |
                    [
                      {
                        "number": "KD924",
                        "route_id": "LHR-SFO",
                        "scheduled_departure": "2024-03-20T09:12:28Z",
                        "scheduled_arrival": "2024-03-20T19:12:28Z"
                      },
                      {
                        "number": "KD925",
                        "route_id": "SFO-LHR",
                        "scheduled_departure": "2024-03-21T09:12:28Z",
                        "scheduled_arrival": "2024-03-21T19:12:28Z"
                      }
                    ]
  "/flights/{flightNumber}":
    get:
      summary: Get a specific flight by flight number
      description: Returns a specific flight given its flight number.
      tags:
        - flight-data
      operationId: get-flight-by-number
      parameters:
        - name: flightNumber
          in: path
          description: The flight number
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: Successful response with the requested flight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
              examples:
                Example Flight KD924:
                  value: |
                    {
                      "number": "KD924",
                      "route_id": "LHR-SFO",
                      "scheduled_departure": "2024-03-20T09:12:28Z",
                      "scheduled_arrival": "2024-03-20T19:12:28Z"
                    }
        '404':
          description: Flight not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  "/flights/{flightNumber}/details":
    get:
      summary: Fetch more details about a flight
      description: Fetch more details about a flight.
      tags:
        - flight-data
      operationId: get-flight-details
      parameters:
        - name: flightNumber
          in: path
          description: The flight number
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: Successful response with the requested flight details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightDetails'
        '404':
          description: Flight not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT bearer token authentication. Obtain a client_id/client_secret by
        registering an application in the KongAir Dev Portal (Dynamic Client
        Registration), then exchange them for a JWT access token via the
        OAuth2 client_credentials grant against the token endpoint:

        ```
        curl -X POST "__OIDC_TOKEN_URL__" \
          -d grant_type=client_credentials \
          -d client_id=<CLIENT_ID> \
          -d client_secret=<CLIENT_SECRET> \
          -d audience="https://kongair.com/api/v1"
        ```

        Send the returned `access_token` on every request:

        ```
        Authorization: Bearer <access_token>
        ```

        Required scopes: `flights:read` for read operations, `flights:write`
        for write operations (encoded in the token's `scope` claim).
  schemas:
    Flight:
      type: object
      properties:
        number:
          type: string
        route_id:
          type: string
        scheduled_departure:
          type: string
          format: date-time
        scheduled_arrival:
          type: string
          format: date-time
      required:
        - number
        - route_id
        - scheduled_departure
        - scheduled_arrival
    FlightDetails:
      type: object
      properties:
        flight_number:
          type: string
        in_flight_entertainment:
          type: boolean
        meal_options:
          type: array
          items:
            type: string
        aircraft_type:
          type: string
      required:
        - flight_number
        - in_flight_entertainment
        - meal_options
        - aircraft_type
