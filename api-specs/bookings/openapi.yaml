openapi: 3.0.0
info:
  title: Bookings API
  description: KongAir Bookings service provides customers the ability to book and retrieve flight bookings on KongAir.
  version: 0.1.0
security:
  - BearerAuth: []
paths:
  /bookings:
    get:
      tags:
        - sales
      summary: Get a customer's current bookings
      operationId: get-bookings
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
              examples:
                Example Bookings list response:
                  value: |
                    [{
                      "ticket_number": "CDF3412",
                      "seat": "32A",
                      "flight": {
                        "number": "KA924",
                        "route_id": "LHR-SFO",
                        "scheduled_departure": "2023-09-03T09:15:00Z",
                        "scheduled_arrival": "2023-09-03T14:23:00Z"
                      }
                    }]
        '401':
          description: Unauthorized
    post:
      tags:
        - sales
      summary: Create a new customer booking
      operationId: post-booking
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            examples:
              Example new booking request body:
                value: |
                  {
                    "flight_number": "KA924",
                    "seat": "32A"
                  }
      responses:
        '201':
          description: Booking Created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                Example new booking response body:
                  value: |
                    {
                      "ticket_number": "CDF3412"
                    }
        '401':
          description: Unauthorized
        '404':
          description: Not Found, likely for the flight_number given
          content:
            text/plain:
              schema:
                type: string
              example: Not found
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT bearer token authentication. Obtain a client_id/client_secret by
        registering an application in the KongAir Dev Portal (Dynamic Client
        Registration), then exchange them for a JWT access token via the
        OAuth2 client_credentials grant against the token endpoint:

        ```
        curl -X POST "__OIDC_TOKEN_URL__" \
          -d grant_type=client_credentials \
          -d client_id=<CLIENT_ID> \
          -d client_secret=<CLIENT_SECRET> \
          -d audience="https://kongair.com/api/v1"
        ```

        Send the returned `access_token` on every request:

        ```
        Authorization: Bearer <access_token>
        ```

        Required scopes: `bookings:read` for reads, `bookings:write` for
        creating bookings (encoded in the token's `scope` claim).
  schemas:
    Booking:
      type: object
      properties:
        ticket_number:
          type: string
        flight:
          type: object
          properties:
            number:
              type: string
            route_id:
              type: string
            scheduled_departure:
              type: string
              format: date-time
            scheduled_arrival:
              type: string
              format: date-time
        seat:
          type: string
      required:
        - ticket_number
        - flight
    BookingRequest:
      type: object
      properties:
        flight_number:
          type: string
        seat:
          type: string
      required:
        - flight_number
    BookingResponse:
      type: object
      properties:
        ticket_number:
          type: string
      required:
        - ticket_number
