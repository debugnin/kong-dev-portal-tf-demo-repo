# Local Kong Gateway Data Plane, connected in hybrid mode to the
# Konnect-hosted control plane managed by this repo's Terraform config
# (konnect_gateway_control_plane.dev_portal_cp). This is the backend that
# var.dataplane_api_base_url (default http://localhost:8000) points at.
#
# Don't run this directly - use scripts/start-local-dp.sh, which generates
# the TLS keypair under ./cert/, registers it with Konnect, resolves the
# control plane's cluster/telemetry endpoints, and then calls
# `docker compose up` with CP_HOST/TP_HOST supplied via ./cert/cp-endpoints.env.
#
# Requires a Kong Enterprise license in KONG_LICENSE_DATA (ACE and
# openid-connect, used by dev-portal-control-plane.tf and
# scripts/deck-sync.sh, are Enterprise-only plugins).

services:
  kong-dp:
    image: "${KONG_IMAGE:-kong/kong-gateway:3.9}"
    container_name: kong-dp-local
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: "${CP_HOST}:443"
      KONG_CLUSTER_SERVER_NAME: "${CP_HOST}"
      KONG_CLUSTER_TELEMETRY_ENDPOINT: "${TP_HOST}:443"
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: "${TP_HOST}"
      KONG_CLUSTER_CERT: /etc/kong/cert/tls.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/cert/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: "system,/etc/kong/cert/tls.crt"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "off"
      KONG_LICENSE_DATA: "${KONG_LICENSE_DATA}"
    volumes:
      - ./cert:/etc/kong/cert:ro
    ports:
      - "8000:8000"
      - "8443:8443"
    restart: unless-stopped
